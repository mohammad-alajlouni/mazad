<h2 class="page-title">{{ bt('summary') }}</h2><div class="table-wrap" data-fit="summary-table" data-max-height="680"><table class="table"><thead><tr><th class="row-number">#</th>{% for key in summary_fields %}<th>{{ bt(key) }}</th>{% endfor %}</tr></thead><tbody>{% for item in page.rows %}<tr><td class="row-number">{{ '%02d' % item.number }}</td>{% for key in summary_fields %}<td>{{ display(item.property_data.get(key)) }}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div>
