<div class="agent-content">{% if project.agent_logo %}<img class="agent-logo" src="{{ project.agent_logo }}">{% else %}<div class="agent-logo"></div>{% endif %}<h2 data-fit="agent-name" data-max-height="70">{{ agent.name }}</h2><div class="agent-description" data-fit="agent-description" data-max-height="365">{{ page.text }}</div></div><div class="agent-contacts" data-fit="agent-contacts" data-max-height="70"><span>{{ agent.social_accounts }}</span><span>{{ agent.phone }}</span><span>{{ agent.website }}</span></div>
