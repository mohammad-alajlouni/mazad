<h2 class="page-title">{{ bt('rental_contracts') }} · {{ page.item.number }}</h2><div class="table-wrap" data-fit="rental-table" data-max-height="780"><table class="table rentals"><thead><tr><th class="row-number">#</th>{% for key in rental_fields %}<th>{{ bt(key) }}</th>{% endfor %}</tr></thead><tbody>{% for row in page.rows %}<tr><td class="row-number">{{ loop.index }}</td>{% for key in rental_fields %}<td>{{ display(row.get(key)) }}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div>
