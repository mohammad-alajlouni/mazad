<!doctype html><html lang="{{ output_language }}" dir="{{ 'rtl' if output_language=='ar' else 'ltr' }}"><head><meta charset="utf-8"><style>
@font-face{font-family:'Noto Sans Arabic';src:url(data:font/ttf;base64,{{ font_data }});font-weight:400;} @font-face{font-family:'Noto Sans Arabic';src:url(data:font/ttf;base64,{{ font_bold }});font-weight:700;}
@page { size: A4; margin: 19mm 17mm 20mm; @bottom-left {content: '{{ t('DEVELOPMENT TEMPLATE') }} · {{ t(status) }}'; font-size:8pt; color:#7b8986;} @bottom-right {direction:ltr;content: counter(page) ' / ' counter(pages);font-size:8pt;color:#7b8986;} }
body {font-family:'Noto Sans Arabic','DejaVu Sans',sans-serif;font-size:10pt;line-height:1.5;color:#233f38;overflow-wrap:anywhere;}
h1 {font-size:29pt;line-height:1.4;margin:7mm 0 5mm;color:{{ branding.get('primary_color','#176858') }};} h2{font-size:18pt;margin:8mm 0 4mm;} h3{font-size:12pt;} .eyebrow{font-size:9pt;letter-spacing:1px;color:#71847d;} .cover{padding:6mm 0 10mm;border-bottom:3px solid {{ branding.get('primary_color','#176858') }};} .muted{color:#71847d;} .item{break-inside:avoid;margin:5mm 0;padding:4mm;background:#f3f6f3;} .booklet-item{break-before:page;}.photo{max-width:100%;max-height:75mm;object-fit:contain;margin:3mm 0;} .logo{max-width:35mm;max-height:18mm;}table{width:100%;border-collapse:collapse;margin:6mm 0;table-layout:fixed;}th,td{padding:3mm;border-bottom:1px solid #dce4df;text-align:start;vertical-align:top;}th{background:#edf3ef;}thead{display:table-header-group;}tr{break-inside:avoid;} .text{white-space:pre-wrap;} .notice{padding:4mm;background:#fff2d9;} .signature{break-inside:avoid;margin-top:8mm;border-top:1px solid #84958c;padding-top:3mm;} .stats{font-size:14pt;padding:5mm;background:#edf3ef;} {% block css %}{% endblock %}
</style></head><body>{% if logo %}<img class="logo" src="{{ logo }}">{% endif %}<div class="eyebrow">{{ branding.get('organization_name','كُتَيِّب' if output_language == 'ar' else 'Kutayyib') }} / <span dir="ltr">{{ project.code }}</span></div>{% block body %}{% endblock %}</body></html>
