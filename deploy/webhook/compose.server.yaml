# Installed at /etc/mazad/compose.server.yaml, outside release checkouts.
services:
  backend:
    image: mazad-backend:${MAZAD_RELEASE:-initial}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  frontend:
    image: mazad-frontend:${MAZAD_RELEASE:-initial}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  nginx:
    ports: !override
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - /etc/mazad/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
